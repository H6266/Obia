services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: falaaa
      POSTGRES_USER: falaaa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-falaaa-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falaaa -d falaaa"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - falaaa-postgres:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://falaaa:${POSTGRES_PASSWORD:-falaaa-local-only}@db:5432/falaaa
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  falaaa-postgres:
