services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: obia
      POSTGRES_USER: obia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obia-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obia -d obia"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - obia-postgres:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://obia:${POSTGRES_PASSWORD:-obia-local-only}@db:5432/obia
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-obia_session}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-obia_csrf}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      AUTH_RATE_WINDOW_SECONDS: ${AUTH_RATE_WINDOW_SECONDS:-60}
      STAFF_SESSION_COOKIE_NAME: ${STAFF_SESSION_COOKIE_NAME:-obia_staff_session}
      STAFF_CSRF_COOKIE_NAME: ${STAFF_CSRF_COOKIE_NAME:-obia_staff_csrf}
      STAFF_SESSION_TTL_HOURS: ${STAFF_SESSION_TTL_HOURS:-8}
      STAFF_AUTH_RATE_LIMIT: ${STAFF_AUTH_RATE_LIMIT:-5}
      STAFF_MFA_ENCRYPTION_KEY: ${STAFF_MFA_ENCRYPTION_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  obia-postgres:
